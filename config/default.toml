# Stage 4 loads only [rules]; other sections remain reserved.
[app]
name = "login-sentry"

[database]
path = "data/login-sentry.sqlite3"

[collector]
poll_interval_seconds = 1

[rules.failure_burst]
enabled = true
window_seconds = 60
threshold = 5
cooldown_seconds = 300

[rules.multi_account]
enabled = true
window_seconds = 300
distinct_username_threshold = 4
cooldown_seconds = 600
