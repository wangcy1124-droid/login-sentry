[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "login-sentry"
version = "0.1.0"
description = "Lightweight login anomaly monitoring for small applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6,<0.116",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
